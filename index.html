<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Pixdot — Branding, Digital Marketing &amp; Creative Solutions Agency</title>
    <meta
      name="description"
      content="Pixdot is a premium creative agency crafting branding, digital marketing, UI/UX, graphic design, websites, and apps for ambitious businesses worldwide."
    />
    <meta
      name="keywords"
      content="branding agency, digital marketing, web design, logo design, packaging design, creative agency, Pixdot"
    />
    <meta name="author" content="Pixdot Studio" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://pixdot.studio/" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pixdot-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0a0f" : "#ffffff");
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pixdot" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://pixdot.studio/" />
    <meta property="og:title" content="Pixdot — Branding, Digital Marketing & Creative Solutions Agency" />
    <meta
      property="og:description"
      content="A premium creative agency crafting branding, digital marketing, UI/UX, graphic design, websites, and apps for ambitious businesses worldwide."
    />
    <meta property="og:image" content="https://pixdot.studio/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pixdot — Branding, Digital Marketing & Creative Solutions Agency" />
    <meta

      content="A premium creative agency crafting branding, digital marketing, UI/UX, graphic design, websites, and apps for ambitious businesses worldwide."
    />
    <meta name="twitter:image" content="https://pixdot.studio/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
